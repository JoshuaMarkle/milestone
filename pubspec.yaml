name: Milestone
description: An app for aspiring drivers

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.0.0
  path_provider: ^2.0.0
  intl: ^0.19.0
  percent_indicator: ^4.0.1
  fl_chart: ^0.67.0
  flutter_staggered_animations:
  animated_text_kit: ^4.2.2
  circular_menu : ^2.0.1
  tutorial_coach_mark: ^1.2.4
  numberpicker: ^2.1.1
  flutter_markdown: ^0.6.14
  flutter_launcher_icons: ^0.13.1
  pdf: ^3.10.1
  printing: ^5.10.3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/playstore.png"
  min_sdk_android: 21

dev_dependencies:
  flutter_test:
    sdk: flutter

  # hive database generators
  build_runner: ^2.1.11
  hive_generator: ^2.0.0

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
